name: Build Samsung Galaxy A03 Core (OneUI A13) - BakaSU

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "samsung_a03_core"
  DEVICE_CODENAME : "a3core"

  CUSTOM_CMDS : "CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- BSP_BUILD_DT_OVERLAY=y"
  EXTRA_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu- CC=clang LD=ld.lld HOSTCC=clang HOSTCXX=clang++"

  # Unisoc sharkl3 BSP (stock build_kernel.sh)
  BSP_BUILD_FAMILY : "sharkl3"
  BSP_BUILD_ANDROID_OS : "y"

  KERNEL_SOURCE : "https://github.com/IverCoder/android_kernel_samsung_a3core"
  KERNEL_BRANCH : "stock"

  # AOSP clang r383902 (same as stock build)
  CLANG_SOURCE : "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz"
  CLANG_BRANCH : ""

  GCC_GNU : true
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : ""
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "a3core_eur_open_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "bakasu" # xxksu, rsuntk, next, bakasu and sukisu

  SUSFS_ENABLE : "true"
  SUSFS_FIXED : "false"

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "oneui_a13"

  PYTHON_VERSION: "3"

  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "samsung_kernel"

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"
  FGETPRIORITY_ENABLE: "false"
  VPNHIDE_ENABLE: "false"

  HOOK_METHOD: "syscall"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: ""

  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "true" # the 4 SUSFS rejects are fixed by Patches/a3core_susfs_fix.py

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Samsung Galaxy A03 Core (OneUI A13)
    runs-on: ubuntu-latest # u can changed to ubuntu 22.04, and need container set ubuntu-latest
    container: ubuntu:focal # if u need use arch linux -> archlinux/archlinux:latest or ubuntu 20.04 -> ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: 🛠️ Setup Container Environment
        run: |
          echo 'APT::Get::Assume-Yes "true";' > /etc/apt/apt.conf.d/90assumeyes
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get remove -y g++-multilib gcc-multilib || true
          apt-get autoremove -y || true
          apt-get install -y --no-install-recommends \
            sudo git wget ca-certificates \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            device-tree-compiler python3 python3-setuptools python-is-python3 \
            bc flex bison libssl-dev libelf-dev libncurses5 libtinfo5 \
            libc6-dev libncurses-dev lz4 zip unzip
          git config --global --add safe.directory '*'
        shell: bash

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🩹 A03 Core - add the SUSFS hunks Samsung's fs/ rejects
        if: env.SUSFS_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          python3 $GITHUB_WORKSPACE/Patches/a3core_susfs_fix.py

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "DTC_OVERLAY_TEST_EXT=$PWD/tools/mkdtimg/ufdt_apply_overlay" >> $GITHUB_ENV
          chmod +x tools/mkdtimg/* || true
          echo '#!/bin/sh' > scripts/setlocalversion
          chmod +x scripts/setlocalversion
          sed -i 's/CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/g' arch/arm64/configs/$DEFCONFIG_NAME
          echo 'CONFIG_LOCALVERSION="-a3core-BakaSU"' >> arch/arm64/configs/$DEFCONFIG_NAME
          echo "KBUILD_CFLAGS += -Wno-error" >> Makefile

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: ⛔ Patch Kernel of fgetpriority
        uses: ./.github/workflows/patch-fgetpriority

      - name: 🛜 Patch Kernel of VPNHide
        uses: ./.github/workflows/patch-vpnhide

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: ✏️ Upload Image
        uses: actions/upload-artifact@v7
        with:
          name: a3core-bakasu-Image
          path: device_kernel/out/arch/arm64/boot/Image
